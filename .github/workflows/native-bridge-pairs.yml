name: Windows FILETIME reader diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    if: vars.CI_BILLING_PAUSED == 'false'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Repeat the existing reader with bounded process evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'filetime-reader-diagnostic'
          New-Item -ItemType Directory $root | Out-Null
          "EVIDENCE=$root" >> $env:GITHUB_ENV
          @{ source = (git rev-parse HEAD); image = $env:ImageVersion; bun = (bun --revision); os = [Runtime.InteropServices.RuntimeInformation]::OSDescription } | ConvertTo-Json | Set-Content (Join-Path $root 'environment.json')
          bun tests/quality/windows-filetime-repeat-diagnostic.ts *> (Join-Path $root 'results.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'At least one original reader observation was unavailable' }
      - name: Retain all process observations
        if: ${{ always() && env.EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-filetime-reader-diagnostic
          path: ${{ runner.temp }}/filetime-reader-diagnostic/
          if-no-files-found: error
          retention-days: 30
