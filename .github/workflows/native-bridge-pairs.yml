name: Windows file time repeat diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    if: vars.CI_BILLING_PAUSED == 'false'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: 0
      BUN_NATIVE_HOST_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          release-target: 'true'
          remap-cargo-home: 'true'
      - name: Prepare host and evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'filetime-repeat'
          New-Item -ItemType Directory $root | Out-Null
          "EVIDENCE=$root" >> $env:GITHUB_ENV
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Directory $sdk | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK fxc.exe unavailable' }
          "GPUI_FXC_PATH=$fxc" >> $env:GITHUB_ENV
          @{ source = (git rev-parse HEAD); image = $env:ImageVersion; os = [Runtime.InteropServices.RuntimeInformation]::OSDescription; bun = (bun --revision) } | ConvertTo-Json | Set-Content (Join-Path $root 'environment.json')
      - name: Build release host and inspected AOT fixture
        run: |
          cargo build --locked --release -p bun-native-host
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          $hostPath = (Resolve-Path 'target/release/bun-native-host.exe').Path
          $env:BUN_NATIVE_HOST = $hostPath
          "BUN_NATIVE_HOST=$hostPath" >> $env:GITHUB_ENV
          Get-FileHash -Algorithm SHA256 $hostPath | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE 'host.json')
          bun test tests/quality/windows-filetime-evidence.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'FILETIME evidence control failed' }
          bun scripts/quality/compile-aot-entries.ts --entry filesystem-grants --host $hostPath --outdir (Join-Path $env:EVIDENCE 'package')
          if ($LASTEXITCODE -ne 0) { throw 'AOT package or inspection failed' }
      - name: Run sixteen alternating pairs with original assertions
        run: |
          $manifest = Get-Content -Raw (Join-Path $env:EVIDENCE 'package/manifest.json') | ConvertFrom-Json
          $records = @()
          for ($i = 0; $i -lt 16; $i++) {
            $order = if ($i % 2 -eq 0) { @('development', 'aot') } else { @('aot', 'development') }
            foreach ($mode in $order) {
              $destination = Join-Path $env:EVIDENCE ('{0:D2}-{1}' -f $i, $mode)
              New-Item -ItemType Directory $destination | Out-Null
              $env:BUN_NATIVE_FILESYSTEM_EVIDENCE = $destination
              $env:BUN_NATIVE_FILESYSTEM_MODE = $mode
              if ($mode -eq 'development') { bun tests/native/filesystem-grants.ts *> (Join-Path $destination 'run.log') } else { & (Join-Path $env:EVIDENCE "package/$($manifest.application.file)") *> (Join-Path $destination 'run.log') }
              $code = $LASTEXITCODE
              $reportPath = Join-Path $destination 'filesystem-grants.json'
              $valid = $false
              if (Test-Path -LiteralPath $reportPath) {
                $report = Get-Content -Raw $reportPath | ConvertFrom-Json
                $valid = $report.platform -eq 'win32' -and $report.backend -eq 'ntcreatefile_walk' -and $report.mode -eq $mode
              }
              $records += @{ trial = $i; mode = $mode; exit = $code; reportValid = $valid }
              $records | ConvertTo-Json | Set-Content (Join-Path $env:EVIDENCE 'results.json')
            }
          }
          if (@($records | Where-Object { $_.exit -ne 0 -or !$_.reportValid }).Count -gt 0) { throw 'One or more original native filesystem checks failed' }
      - name: Retain all original outcomes and diagnostics
        if: ${{ always() && env.EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-filetime-repeat
          path: |
            ${{ runner.temp }}/filetime-repeat/
            !${{ runner.temp }}/filetime-repeat/package/*.exe
          if-no-files-found: error
          retention-days: 30
