name: Benchmark comparison

# Non-gating measurement job: never a required check. It records raw results
# for core/Solid/React in development and AOT modes, including real XTest
# input-to-native-paint latency, and uploads them as an artifact. A passed job
# means every launch and equivalence check passed, not that performance improved.
on:
  workflow_dispatch:
    inputs:
      retention-diagnostic:
        description: Run the isolated Windows retention scan control only
        type: choice
        options:
          [
            'none',
            'narrow-scan',
            'batch-release',
            'listener',
            'safe-listener',
            'react-empty-unmount',
            'react-empty-safe',
            'react-fixture-setters',
            'core-ownership',
            'core-group',
            'fixture-core-matrix',
            'native-fixture',
            'native-safe-fixture',
            'shutdown',
            'first-observation',
            'timer-collection',
            'runtime-preflight',
            'runtime-cross-preflight',
            'runtime-cross-tools',
            'runtime-cross-build',
            'runtime-build',
            'runtime-compare',
            'runtime-link-control',
            'runtime-link-inspect',
            'runtime-rust-symbols',
            'runtime-rust-relink',
            'runtime-force-build',
            'runtime-force-compare',
            'runtime-strong-build',
            'runtime-trace-build',
            'runtime-full-trace-build',
            'runtime-slot-trace-build',
            'runtime-origin-trace-build',
            'runtime-clear-trace-build',
            'runtime-clear-trace-compare',
            'runtime-unwind-preflight',
            'runtime-libuv-noinline-build',
            'runtime-libuv-native-trim-build',
            'runtime-libuv-poll-clear-trim-build',
            'runtime-libuv-poll-clear-trim-compare',
            'runtime-libuv-native-trim-compare',
            'runtime-coff-lib-preflight',
            'runtime-libuv-poll-clear-build',
            'runtime-libuv-poll-clear-compare',
            'runtime-libuv-poll-clear-calibration',
            'runtime-libuv-poll-clear-performance',
            'runtime-libuv-poll-clear-io',
            'runtime-libuv-poll-clear-jit-aot',
            'runtime-libuv-poll-clear-jit-native',
            'runtime-libuv-poll-clear-jit-native-fixture',
            'runtime-libuv-poll-clear-jit-native-core',
            'runtime-libuv-poll-clear-jit-native-solid',
            'runtime-libuv-noinline-compare',
            'runtime-libuv-native-compare',
            'runtime-libuv-native-calibration',
            'runtime-libuv-native-performance',
            'runtime-unwind-build',
            'runtime-unwind-trace-compare',
            'runtime-origin-trace-compare',
            'runtime-slot-trace-compare',
            'runtime-slot-stack-compare',
            'runtime-full-trace-compare',
            'runtime-trace-compare',
            'runtime-strong-compare',
            'runtime-strong-dev-compare',
          ]
        default: 'none'
      runtime-build-run:
        description: Successful runtime-build run ID for the paired diagnostic
        default: ''
      trials:
        description: Measured timed trials per artifact (3 to 30)
        default: '5'
      input-trials:
        description: XTest click-to-paint launches per artifact (0, or 3 to 30)
        default: '5'
      cold-cache:
        description: Sync and drop the page cache before every timed launch (sudo on the runner)
        type: boolean
        default: false
      streaming-trials:
        description: Streaming-list soaks per framework and mode (1 to 10)
        default: '3'
      concurrent-jit:
        description: Diagnostic for #629. 'off' sets BUN_JSC_useConcurrentJIT=0 for every launch; assertions are unchanged
        type: choice
        options: ['on', 'off']
        default: 'on'
  schedule:
    - cron: '47 6 * * 3'
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - .github/workflows/benchmark-comparison.yml
      - .github/actions/linux-native-prerequisites/**
      - benchmarks/comparison/**
      - benchmarks/rust-gpui/**
      - native/gpui-host/examples/workload-baseline.rs
      - benchmarks/solid/**
      - benchmarks/streaming-list-fixture.ts
      - tests/native/*streaming-list*
      - scripts/quality/regression-check.ts
      - scripts/quality/native-input-linux.py
      - scripts/quality/native_harness/**

permissions:
  contents: read

concurrency:
  group: benchmark-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic != 'none' && format('-{0}', inputs.retention-diagnostic) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-runtime-link-inspect:
    name: Inspect retained Windows runtime linker inputs
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-link-inspect' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified LLVM 23.1.1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-23.1.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '11af43ba261a1158090dd6f0da40d7a34f32dbfb4a76b43240bffa1ebb140984') { throw 'LLVM installer digest mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
      - name: Inspect the retained failed-build objects
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -notmatch '^[0-9]+$') { throw 'runtime-build-run must be a numeric run ID' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or $run.event -ne 'workflow_dispatch' -or $run.headBranch -ne $env:GITHUB_REF_NAME -or $run.workflowName -ne 'Benchmark comparison') { throw 'Expected a failed source-build dispatch from this branch' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_BUILD_RUN/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'Build pinned Windows runtime from source' -and $_.conclusion -eq 'failure' }).Count -ne 1) { throw 'Expected exactly one failed source-build job' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-link-inspection'
          New-Item -ItemType Directory -Path $root | Out-Null
          $run | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'source-run.json')
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-uninstrumented-source-runtime --dir (Join-Path $root 'inputs')
          if ($LASTEXITCODE -ne 0) { throw 'Failed-build artifact download failed' }
          foreach ($name in @('RunLoopBun.cpp.obj', 'UnifiedSource-runtime-28.cpp.obj')) {
            $object = @(Get-ChildItem (Join-Path $root 'inputs') -File -Recurse -Filter $name)
            if ($object.Count -ne 1) { throw "Expected one $name" }
            Get-FileHash -Algorithm SHA256 $object[0].FullName | Format-List | Out-File (Join-Path $root "$name.hash.txt")
            & 'C:\Program Files\LLVM\bin\llvm-nm.exe' --format=posix $object[0].FullName > (Join-Path $root "$name.symbols.txt")
            if ($LASTEXITCODE -ne 0) { throw "Symbol inspection failed: $name" }
            & 'C:\Program Files\LLVM\bin\clang.exe' -S -emit-llvm -x ir $object[0].FullName -o (Join-Path $root "$name.ll")
            if ($LASTEXITCODE -ne 0) { throw "Bitcode inspection failed: $name" }
            Select-String -Path (Join-Path $root "$name.ll") -Pattern 'WTFTimer__update' | Out-File (Join-Path $root "$name.timer.txt")
          }
      - name: Retain inspection and input identities
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-link-inspection
          path: |
            ${{ runner.temp }}/runtime-link-inspection/
            !${{ runner.temp }}/runtime-link-inspection/**/*.ll
            !${{ runner.temp }}/runtime-link-inspection/inputs/**/*.obj
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-link-control:
    name: Windows weak timer symbol link control
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-link-control' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified LLVM 23.1.1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-23.1.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '11af43ba261a1158090dd6f0da40d7a34f32dbfb4a76b43240bffa1ebb140984') { throw 'LLVM installer digest mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
      - name: Install the source-build Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-15 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' }
      - name: Compare weak and strong imports with and without ThinLTO
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-15
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'runtime-link-control'
          New-Item -ItemType Directory -Path $root | Out-Null
          ./benchmarks/retention/windows-weak-link.ps1 -Output $root -LlvmBin 'C:\Program Files\LLVM\bin'
      - name: Retain every compiler and linker outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-link-control
          path: ${{ runner.temp }}/runtime-link-control/
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-compare:
    name: Compare source-built and distributed Windows runtimes
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["runtime-compare", "runtime-force-compare", "runtime-strong-compare", "runtime-strong-dev-compare"]'), inputs.retention-diagnostic) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Verify and download the source-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -notmatch '^[0-9]+$') { throw 'runtime-build-run must be a numeric run ID' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch' -or $run.headBranch -ne $env:GITHUB_REF_NAME -or $run.workflowName -ne 'Benchmark comparison') { throw 'The source-build run is not a successful dispatch from this branch' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_BUILD_RUN/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'Build pinned Windows runtime from source' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'The source-build job did not succeed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-comparison'
          New-Item -ItemType Directory -Path $root | Out-Null
          $run | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'source-run.json')
          $artifactName = if ($env:RETENTION_DIAGNOSTIC -in @('runtime-strong-compare', 'runtime-strong-dev-compare')) { 'windows-strong-timer-diagnostic' } elseif ($env:RETENTION_DIAGNOSTIC -eq 'runtime-force-compare') { 'windows-forced-timer-source-runtime' } else { 'windows-uninstrumented-source-runtime' }
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name $artifactName --dir (Join-Path $root 'source-artifact')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime artifact download failed' }
          $runtime = @(Get-ChildItem (Join-Path $root 'source-artifact') -Filter bun.exe -File -Recurse)
          $manifest = @(Get-ChildItem (Join-Path $root 'source-artifact') -Filter runtime-build-adjustments.json -File -Recurse)
          if ($runtime.Count -ne 1 -or $manifest.Count -ne 1) { throw 'Runtime artifact must contain exactly one binary and adjustment manifest' }
          $adjustments = Get-Content -Raw -LiteralPath $manifest[0].FullName | ConvertFrom-Json
          $sourceAdjustment = $adjustments.'webkit/Source/WTF/wtf/bun/RunLoopBun.cpp'
          $upstreamBuildKey = @('scripts', 'build', 'bun.ts') -join '/'
          $timerAdjustment = $adjustments.$upstreamBuildKey
          if ($env:RETENTION_DIAGNOSTIC -in @('runtime-strong-compare', 'runtime-strong-dev-compare')) {
            if (!$sourceAdjustment -or $sourceAdjustment.originalSha256 -ne '9053c4e134bb758077975c58168f003ad51ffc1cf5287f0f627f9e52abb60378' -or $sourceAdjustment.adjustedSha256 -ne 'e081b917bdeaf5ad3facba1b973997ce1e70051d014abd69def12f4ae896610f' -or $timerAdjustment) { throw 'Unexpected strong-timer diagnostic identity' }
          } elseif ($sourceAdjustment) { throw 'Comparison refuses a runtime-source diagnostic build' }
          if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-force-compare') {
            if (!$timerAdjustment -or $timerAdjustment.originalSha256 -ne '1e12ec96773620eabda30ac1833509128d814905ee99f8bbf5c66cac4d36a8f9' -or $timerAdjustment.adjustedSha256 -ne '984e32a75d042e4711b2a83dac96598202465fded9542766e69d4ab6218ba3b8') { throw 'Unexpected forced-timer build identity' }
          } elseif ($timerAdjustment) { throw 'Unforced comparison refuses a forced-timer build' }
          "SOURCE_RUNTIME=$($runtime[0].FullName)" >> $env:GITHUB_ENV
      - name: Run alternating headless runtime controls
        env:
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'runtime-comparison'
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          $pinned = (Get-Command bun -CommandType Application).Source
          $extra = @(if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-strong-dev-compare') { '--development-controls-only' })
          python benchmarks/retention/runtime-pairs.py (Join-Path $root 'peer.exe') $pinned $env:SOURCE_RUNTIME (Join-Path $root 'pairs') --pairs 3 @extra
          if ($LASTEXITCODE -ne 0) { throw 'At least one paired runtime control was invalid' }
      - name: Retain every control and source identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-comparison
          path: |
            ${{ runner.temp }}/runtime-comparison/
            !${{ runner.temp }}/runtime-comparison/**/*.exe
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-trace-compare:
    name: Compare bounded collector traces on Windows
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-trace-compare' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Verify and download the pinned instrumented runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -ne '45305235060') { throw 'Unexpected trace build run' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.headSha -ne '0724c4785975c3ab31bcecf54f9409185a542e55' -or $run.event -ne 'workflow_dispatch' -or $run.workflowName -ne 'Benchmark comparison') { throw 'Trace runtime build identity or status did not match' }
          $root = Join-Path $env:RUNNER_TEMP 'collector-trace-comparison'
          New-Item -ItemType Directory -Path $root | Out-Null
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-collector-trace-runtime --dir (Join-Path $root 'runtime')
          if ($LASTEXITCODE -ne 0) { throw 'Trace runtime download failed' }
          $binary = @(Get-ChildItem (Join-Path $root 'runtime') -Filter bun.exe -File -Recurse)
          $manifests = @(Get-ChildItem (Join-Path $root 'runtime') -Filter collector-trace-adjustments.json -File -Recurse)
          if ($binary.Count -ne 1 -or $manifests.Count -ne 1) { throw 'Expected one trace runtime and manifest' }
          $manifest = Get-Content -Raw -LiteralPath $manifests[0].FullName | ConvertFrom-Json
          if ($manifest.headerSha256 -ne '18996262a48ecdffd789761c6283a9bcd2b55b955415f89bd44da041987054db' -or $manifest.originalSha256[0] -ne '22102e605c012f0134a35c1191f7f4ebb159836fcc8dd078103abcf5de26ff3f' -or $manifest.originalSha256[1] -ne '4d8bff93828c52d141a631f2c261a349b0c122b0aab81290262566d339ff901b' -or $manifest.originalSha256[2] -ne '691b8688cc95a88ae35832dd9b58b368914ad12c89ea8532977ea33e6226d45e') { throw 'Trace source identity did not match' }
          if ($manifest.instrumentedSha256[0] -ne 'a2425a80c34d0029c127692ad67f29d7537071a2ab5e42082243e2546b6eda07' -or $manifest.instrumentedSha256[1] -ne '1e3b58a172768642faaa2997c754ce6cf6639d0fae20c807f28216ee213c97d5' -or $manifest.instrumentedSha256[2] -ne 'a0d8e2b25db1d2234f230fa6294ba4038190bf87b8a2471a1e08f1efbaf2fc80') { throw 'Trace instrumentation did not match the reviewed source' }
          "SOURCE_RUNTIME=$($binary[0].FullName)" >> $env:GITHUB_ENV
      - name: Compare pinned and instrumented development runtimes
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'collector-trace-comparison'
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          $pinned = (Get-Command bun -CommandType Application).Source
          python benchmarks/retention/runtime-pairs.py (Join-Path $root 'peer.exe') $pinned $env:SOURCE_RUNTIME (Join-Path $root 'pairs') --pairs 3 --development-controls-only --collector-trace
          if ($LASTEXITCODE -ne 0) { throw 'A runtime or trace control was invalid' }
      - name: Retain controls and bounded traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-collector-trace-comparison
          path: |
            ${{ runner.temp }}/collector-trace-comparison/
            !${{ runner.temp }}/collector-trace-comparison/**/*.exe
          if-no-files-found: warn
          retention-days: 7

  windows-runtime-full-trace-compare:
    name: Compare full bounded collector traces on Windows
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-full-trace-compare' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Verify and download the pinned instrumented runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -ne '45316708468') { throw 'Unexpected trace build run' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.headSha -ne 'e9feebb8a4dedc2b83b207bedf9f863af998907c' -or $run.event -ne 'workflow_dispatch' -or $run.workflowName -ne 'Benchmark comparison') { throw 'Trace runtime build identity or status did not match' }
          $root = Join-Path $env:RUNNER_TEMP 'collector-trace-comparison'
          New-Item -ItemType Directory -Path $root | Out-Null
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-full-collector-trace-runtime --dir (Join-Path $root 'runtime')
          if ($LASTEXITCODE -ne 0) { throw 'Trace runtime download failed' }
          $binary = @(Get-ChildItem (Join-Path $root 'runtime') -Filter bun.exe -File -Recurse)
          $manifests = @(Get-ChildItem (Join-Path $root 'runtime') -Filter collector-trace-adjustments.json -File -Recurse)
          if ($binary.Count -ne 1 -or $manifests.Count -ne 1) { throw 'Expected one trace runtime and manifest' }
          $manifest = Get-Content -Raw -LiteralPath $manifests[0].FullName | ConvertFrom-Json
          if ($manifest.headerSha256 -ne '18996262a48ecdffd789761c6283a9bcd2b55b955415f89bd44da041987054db' -or $manifest.originalSha256[0] -ne '22102e605c012f0134a35c1191f7f4ebb159836fcc8dd078103abcf5de26ff3f' -or $manifest.originalSha256[1] -ne '4d8bff93828c52d141a631f2c261a349b0c122b0aab81290262566d339ff901b' -or $manifest.originalSha256[2] -ne '691b8688cc95a88ae35832dd9b58b368914ad12c89ea8532977ea33e6226d45e') { throw 'Trace source identity did not match' }
