name: Benchmark comparison

# Non-gating measurement job: never a required check. It records raw results
# for core/Solid/React in development and AOT modes, including real XTest
# input-to-native-paint latency, and uploads them as an artifact. A passed job
# means every launch and equivalence check passed, not that performance improved.
on:
  workflow_dispatch:
    inputs:
      retention-diagnostic:
        description: Run the isolated Windows retention scan control only
        type: choice
        options:
          [
            'none',
            'narrow-scan',
            'batch-release',
            'listener',
            'fixture-core-matrix',
            'native-fixture',
            'shutdown',
            'first-observation',
            'runtime-preflight',
            'runtime-cross-preflight',
            'runtime-cross-tools',
            'runtime-cross-build',
            'runtime-build',
            'runtime-compare',
            'runtime-link-control',
            'runtime-link-inspect',
            'runtime-rust-symbols',
            'runtime-rust-relink',
            'runtime-force-build',
            'runtime-force-compare',
            'runtime-strong-build',
            'runtime-strong-compare',
            'runtime-strong-dev-compare',
          ]
        default: 'none'
      runtime-build-run:
        description: Successful runtime-build run ID for the paired diagnostic
        default: ''
      trials:
        description: Measured timed trials per artifact (3 to 30)
        default: '5'
      input-trials:
        description: XTest click-to-paint launches per artifact (0, or 3 to 30)
        default: '5'
      cold-cache:
        description: Sync and drop the page cache before every timed launch (sudo on the runner)
        type: boolean
        default: false
      streaming-trials:
        description: Streaming-list soaks per framework and mode (1 to 10)
        default: '3'
      concurrent-jit:
        description: Diagnostic for #629. 'off' sets BUN_JSC_useConcurrentJIT=0 for every launch; assertions are unchanged
        type: choice
        options: ['on', 'off']
        default: 'on'
  schedule:
    - cron: '47 6 * * 3'
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - .github/workflows/benchmark-comparison.yml
      - .github/actions/linux-native-prerequisites/**
      - benchmarks/comparison/**
      - benchmarks/rust-gpui/**
      - native/gpui-host/examples/workload-baseline.rs
      - benchmarks/solid/**
      - benchmarks/streaming-list-fixture.ts
      - tests/native/*streaming-list*
      - scripts/quality/regression-check.ts
      - scripts/quality/native-input-linux.py
      - scripts/quality/native_harness/**

permissions:
  contents: read

concurrency:
  group: benchmark-comparison-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic != 'none' && format('-{0}', inputs.retention-diagnostic) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-runtime-link-inspect:
    name: Inspect retained Windows runtime linker inputs
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-link-inspect' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified LLVM 23.1.1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-23.1.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '11af43ba261a1158090dd6f0da40d7a34f32dbfb4a76b43240bffa1ebb140984') { throw 'LLVM installer digest mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
      - name: Inspect the retained failed-build objects
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -notmatch '^[0-9]+$') { throw 'runtime-build-run must be a numeric run ID' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or $run.event -ne 'workflow_dispatch' -or $run.headBranch -ne $env:GITHUB_REF_NAME -or $run.workflowName -ne 'Benchmark comparison') { throw 'Expected a failed source-build dispatch from this branch' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_BUILD_RUN/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'Build pinned Windows runtime from source' -and $_.conclusion -eq 'failure' }).Count -ne 1) { throw 'Expected exactly one failed source-build job' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-link-inspection'
          New-Item -ItemType Directory -Path $root | Out-Null
          $run | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'source-run.json')
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-uninstrumented-source-runtime --dir (Join-Path $root 'inputs')
          if ($LASTEXITCODE -ne 0) { throw 'Failed-build artifact download failed' }
          foreach ($name in @('RunLoopBun.cpp.obj', 'UnifiedSource-runtime-28.cpp.obj')) {
            $object = @(Get-ChildItem (Join-Path $root 'inputs') -File -Recurse -Filter $name)
            if ($object.Count -ne 1) { throw "Expected one $name" }
            Get-FileHash -Algorithm SHA256 $object[0].FullName | Format-List | Out-File (Join-Path $root "$name.hash.txt")
            & 'C:\Program Files\LLVM\bin\llvm-nm.exe' --format=posix $object[0].FullName > (Join-Path $root "$name.symbols.txt")
            if ($LASTEXITCODE -ne 0) { throw "Symbol inspection failed: $name" }
            & 'C:\Program Files\LLVM\bin\clang.exe' -S -emit-llvm -x ir $object[0].FullName -o (Join-Path $root "$name.ll")
            if ($LASTEXITCODE -ne 0) { throw "Bitcode inspection failed: $name" }
            Select-String -Path (Join-Path $root "$name.ll") -Pattern 'WTFTimer__update' | Out-File (Join-Path $root "$name.timer.txt")
          }
      - name: Retain inspection and input identities
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-link-inspection
          path: |
            ${{ runner.temp }}/runtime-link-inspection/
            !${{ runner.temp }}/runtime-link-inspection/**/*.ll
            !${{ runner.temp }}/runtime-link-inspection/inputs/**/*.obj
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-link-control:
    name: Windows weak timer symbol link control
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-link-control' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified LLVM 23.1.1
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-23.1.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '11af43ba261a1158090dd6f0da40d7a34f32dbfb4a76b43240bffa1ebb140984') { throw 'LLVM installer digest mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
      - name: Install the source-build Rust toolchain
        run: |
          rustup toolchain install nightly-2026-09-15 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' }
      - name: Compare weak and strong imports with and without ThinLTO
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-15
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'runtime-link-control'
          New-Item -ItemType Directory -Path $root | Out-Null
          ./benchmarks/retention/windows-weak-link.ps1 -Output $root -LlvmBin 'C:\Program Files\LLVM\bin'
      - name: Retain every compiler and linker outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-link-control
          path: ${{ runner.temp }}/runtime-link-control/
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-compare:
    name: Compare source-built and distributed Windows runtimes
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["runtime-compare", "runtime-force-compare", "runtime-strong-compare", "runtime-strong-dev-compare"]'), inputs.retention-diagnostic) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Verify and download the source-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -notmatch '^[0-9]+$') { throw 'runtime-build-run must be a numeric run ID' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,headSha,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.event -ne 'workflow_dispatch' -or $run.headBranch -ne $env:GITHUB_REF_NAME -or $run.workflowName -ne 'Benchmark comparison') { throw 'The source-build run is not a successful dispatch from this branch' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUNTIME_BUILD_RUN/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -eq 'Build pinned Windows runtime from source' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'The source-build job did not succeed' }
          $root = Join-Path $env:RUNNER_TEMP 'runtime-comparison'
          New-Item -ItemType Directory -Path $root | Out-Null
          $run | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'source-run.json')
          $artifactName = if ($env:RETENTION_DIAGNOSTIC -in @('runtime-strong-compare', 'runtime-strong-dev-compare')) { 'windows-strong-timer-diagnostic' } elseif ($env:RETENTION_DIAGNOSTIC -eq 'runtime-force-compare') { 'windows-forced-timer-source-runtime' } else { 'windows-uninstrumented-source-runtime' }
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name $artifactName --dir (Join-Path $root 'source-artifact')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime artifact download failed' }
          $runtime = @(Get-ChildItem (Join-Path $root 'source-artifact') -Filter bun.exe -File -Recurse)
          $manifest = @(Get-ChildItem (Join-Path $root 'source-artifact') -Filter runtime-build-adjustments.json -File -Recurse)
          if ($runtime.Count -ne 1 -or $manifest.Count -ne 1) { throw 'Runtime artifact must contain exactly one binary and adjustment manifest' }
          $adjustments = Get-Content -Raw -LiteralPath $manifest[0].FullName | ConvertFrom-Json
          $sourceAdjustment = $adjustments.'webkit/Source/WTF/wtf/bun/RunLoopBun.cpp'
          $upstreamBuildKey = @('scripts', 'build', 'bun.ts') -join '/'
          $timerAdjustment = $adjustments.$upstreamBuildKey
          if ($env:RETENTION_DIAGNOSTIC -in @('runtime-strong-compare', 'runtime-strong-dev-compare')) {
            if (!$sourceAdjustment -or $sourceAdjustment.originalSha256 -ne '9053c4e134bb758077975c58168f003ad51ffc1cf5287f0f627f9e52abb60378' -or $sourceAdjustment.adjustedSha256 -ne 'e081b917bdeaf5ad3facba1b973997ce1e70051d014abd69def12f4ae896610f' -or $timerAdjustment) { throw 'Unexpected strong-timer diagnostic identity' }
          } elseif ($sourceAdjustment) { throw 'Comparison refuses a runtime-source diagnostic build' }
          if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-force-compare') {
            if (!$timerAdjustment -or $timerAdjustment.originalSha256 -ne '1e12ec96773620eabda30ac1833509128d814905ee99f8bbf5c66cac4d36a8f9' -or $timerAdjustment.adjustedSha256 -ne '984e32a75d042e4711b2a83dac96598202465fded9542766e69d4ab6218ba3b8') { throw 'Unexpected forced-timer build identity' }
          } elseif ($timerAdjustment) { throw 'Unforced comparison refuses a forced-timer build' }
          "SOURCE_RUNTIME=$($runtime[0].FullName)" >> $env:GITHUB_ENV
      - name: Run alternating headless runtime controls
        env:
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'runtime-comparison'
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          $pinned = (Get-Command bun -CommandType Application).Source
          $extra = @(if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-strong-dev-compare') { '--development-controls-only' })
          python benchmarks/retention/runtime-pairs.py (Join-Path $root 'peer.exe') $pinned $env:SOURCE_RUNTIME (Join-Path $root 'pairs') --pairs 3 @extra
          if ($LASTEXITCODE -ne 0) { throw 'At least one paired runtime control was invalid' }
      - name: Retain every control and source identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-comparison
          path: |
            ${{ runner.temp }}/runtime-comparison/
            !${{ runner.temp }}/runtime-comparison/**/*.exe
          if-no-files-found: warn
          retention-days: 30

  windows-runtime-build:
    name: Build pinned Windows runtime from source
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["runtime-build", "runtime-rust-symbols", "runtime-rust-relink", "runtime-force-build", "runtime-strong-build"]'), inputs.retention-diagnostic) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/bun
          ref: b1007f1177fd402fae67387b8548cae5ae9b5707
          path: bun-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: oven-sh/WebKit
          ref: 4d45755fed4aeef19e95beb90d3d0c884a2812bd
          path: webkit-source
          sparse-checkout: |
            Source
            Tools
            icu
          persist-credentials: false
      - name: Provision verified LLVM and native build tools
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm-23.1.1.msi'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '11af43ba261a1158090dd6f0da40d7a34f32dbfb4a76b43240bffa1ebb140984') { throw 'LLVM installer digest mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart', 'INSTALLDIR=C:\LLVM23') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "LLVM installer failed: $($install.ExitCode)" }
          choco install nasm cygwin --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows native tool provisioning failed' }
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src --component llvm-tools
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain install failed' }
      - name: Apply recorded upstream build-script adjustments
        env:
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          $adjustArgs = @((Join-Path $env:GITHUB_WORKSPACE 'bun-source'), (Join-Path $env:GITHUB_WORKSPACE 'webkit-source'), (Join-Path $env:RUNNER_TEMP 'runtime-build-adjustments.json'))
          if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-force-build') { $adjustArgs += '--force-timer' }
          if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-strong-build') { $adjustArgs += '--strong-timer' }
          python benchmarks/retention/shorten-upstream-build.py @adjustArgs
          if ($LASTEXITCODE -ne 0) { throw 'Build adjustment failed' }
      - name: Download inputs for the partial link
        if: inputs.retention-diagnostic == 'runtime-rust-relink'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_BUILD_RUN: ${{ inputs.runtime-build-run }}
        run: |
          if ($env:RUNTIME_BUILD_RUN -ne '45155613235') { throw 'The partial link requires the identified failed source build' }
          $run = gh run view $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --json status,conclusion,headBranch,event,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'failure' -or $run.headBranch -ne $env:GITHUB_REF_NAME -or $run.event -ne 'workflow_dispatch' -or $run.workflowName -ne 'Benchmark comparison') { throw 'Unexpected failed source-build identity' }
          gh run download $env:RUNTIME_BUILD_RUN --repo $env:GITHUB_REPOSITORY --name windows-uninstrumented-source-runtime --dir (Join-Path $env:RUNNER_TEMP 'runtime-rust-relink-inputs')
          if ($LASTEXITCODE -ne 0) { throw 'Failed-build input download failed' }
      - name: Build source runtime with adjusted codegen paths and release LTO
        env:
          RETENTION_DIAGNOSTIC: ${{ inputs.retention-diagnostic }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'bun-source'
          $webkit = Join-Path $env:GITHUB_WORKSPACE 'webkit-source'
          if ((Test-Path 'D:\b') -or (Test-Path 'D:\w')) { throw 'Short build paths already exist' }
          try {
          Move-Item $source 'D:\b'
          Move-Item $webkit 'D:\w'
          Set-Location 'D:\b'
          . (Join-Path (Join-Path (Get-Location).Path 'scripts') 'vs-shell.ps1')
          $paths = @($env:PATH, [Environment]::GetEnvironmentVariable('PATH', 'Machine'), [Environment]::GetEnvironmentVariable('PATH', 'User')) -join ';'
          $cleanPath = ($paths -split ';' | Where-Object { $_ -and $_ -notmatch '(?i)strawberry' }) -join ';'
          $llvmDir = @('C:\LLVM23\bin', 'C:\Program Files\LLVM\bin') | Where-Object {
            (Test-Path (Join-Path $_ 'clang.exe')) -and ((& (Join-Path $_ 'clang.exe') --version | Select-Object -First 1) -match 'clang version 23\.1\.1')
          } | Select-Object -First 1
          if (-not $llvmDir) { throw 'Verified LLVM 23.1.1 executable not found' }
          $env:PATH = "$llvmDir;C:\Program Files\NASM;$cleanPath;C:\Program Files\Git\usr\bin;C:\cygwin64\bin"
          $env:BUN_WEBKIT_PATH = 'D:\w'
          $env:RUSTUP_TOOLCHAIN = 'nightly-2026-09-15'
          clang --version
          nasm --version
          perl --version
          rustc --version --verbose
          $webkitRevision = git -C $env:BUN_WEBKIT_PATH rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $webkitRevision -ne '4d45755fed4aeef19e95beb90d3d0c884a2812bd') { throw "Unexpected WebKit checkout: $webkitRevision" }
          $sourceRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceRevision -ne 'b1007f1177fd402fae67387b8548cae5ae9b5707') { throw "Unexpected Bun checkout: $sourceRevision" }
          Write-Host "Bun source: $sourceRevision; WebKit source: $webkitRevision"
          # Bun's build script prefers CI commit variables over the checkout.
          # This step builds Bun, not the repository that dispatched the job.
          $env:BUILDKITE_COMMIT = $sourceRevision
          $env:GITHUB_SHA = $sourceRevision
          $env:GIT_SHA = $sourceRevision
          $aotSources = Join-Path $env:BUN_WEBKIT_PATH 'Source/JavaScriptCore/aot/Sources.txt'
          if ([Array]::IndexOf([IO.File]::ReadAllBytes($aotSources), [byte]13) -ge 0) { throw 'WebKit AOT source list contains CRLF' }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Bun source dependency install failed' }
          if ($env:RETENTION_DIAGNOSTIC -in @('runtime-rust-symbols', 'runtime-rust-relink')) {
            bun scripts/build.ts --profile=release-local --lto=on --build-dir=build/release-local --target=bun-rust
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust archive build failed' }
            $archives = @(Get-ChildItem build/release-local/rust-target -File -Recurse -Filter 'libbun_runtime-*.rlib')
            if ($archives.Count -ne 1) { throw 'Expected exactly one Bun runtime archive' }
            $evidence = Join-Path $env:RUNNER_TEMP 'runtime-rust-symbols'
            New-Item -ItemType Directory -Path $evidence | Out-Null
            Get-FileHash -Algorithm SHA256 $archives[0].FullName | Format-List | Out-File (Join-Path $evidence 'archive-hash.txt')
            & (Join-Path $llvmDir 'llvm-nm.exe') --format=posix --defined-only $archives[0].FullName *> (Join-Path $evidence 'runtime-symbols.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Rust archive symbol inspection failed' }
            rustc --version --verbose | Out-File (Join-Path $evidence 'rust-version.txt')
            if ($LASTEXITCODE -ne 0) { throw 'Rust compiler identity failed' }
            if ($env:RETENTION_DIAGNOSTIC -eq 'runtime-rust-relink') {
              $objects = @()
              foreach ($item in @(@('RunLoopBun.cpp.obj', '94b196204805f39566f1d1a06df18baec8755458577a45fe72b8d6fff6379011'), @('UnifiedSource-runtime-28.cpp.obj', '2e25b5e0a68babc3750d70b33325cfd3cabf08a2ef325a95606b441cc72a63a7'))) {
                $found = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'runtime-rust-relink-inputs') -File -Recurse -Filter $item[0])
                if ($found.Count -ne 1 -or (Get-FileHash -Algorithm SHA256 $found[0].FullName).Hash -ne $item[1]) { throw 'Retained object identity mismatch' }
                $objects += $found[0].FullName
              }
              $records = @()
              foreach ($force in @($false, $true)) {
                $label = if ($force) { 'forced' } else { 'ordinary' }
                $dll = Join-Path $evidence "$label.dll"
                $linkArgs = @('/dll', '/noentry', '/nodefaultlib', '/force:unresolved', '/opt:noref', '/LTCG', '/opt:lldlto=2', '/opt:lldltocgo=2', "/out:$dll")
                if ($force) { $linkArgs += '/include:WTFTimer__update' }
                & (Join-Path $llvmDir 'lld-link.exe') @linkArgs @objects $archives[0].FullName *> (Join-Path $evidence "$label-link.log")
                $linkExit = $LASTEXITCODE
                Remove-Item -LiteralPath $dll, (Join-Path $evidence "$label.lib"), (Join-Path $evidence "$label.exp") -Force -ErrorAction SilentlyContinue
                $records += @{ forceTimer = $force; exitCode = $linkExit; scope = 'partial link; unresolved references allowed; output removed without execution' }
              }
              $records | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $evidence 'partial-link-results.json')
              $global:LASTEXITCODE = 0
            }
            return
          }
          # Upstream disables trimmable links on native Windows even when
          # requested. The paired AOT inspection therefore remains essential.
          bun scripts/build.ts --profile=release-local --lto=on --build-dir=build/release-local
          if ($LASTEXITCODE -ne 0) { throw 'Source runtime build failed' }
          $runtime = Resolve-Path build/release-local/bun.exe
          Get-FileHash -Algorithm SHA256 $runtime
          & $runtime --revision
          if ($LASTEXITCODE -ne 0) { throw 'Built runtime revision check failed' }
          $revision = & $runtime -e 'process.stdout.write(Bun.revision)'
          if ($LASTEXITCODE -ne 0 -or $revision -ne 'b1007f1177fd402fae67387b8548cae5ae9b5707') { throw "Unexpected built runtime revision: $revision" }
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            if (Test-Path 'D:\b') { Move-Item 'D:\b' $source }
            if (Test-Path 'D:\w') { Move-Item 'D:\w' $webkit }
          }
      - name: Retain targeted linker inputs after a build failure
        if: ${{ failure() }}
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'bun-source/build/release-local'
          $evidence = Join-Path $env:RUNNER_TEMP 'runtime-link-inputs'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $paths = @(
            'build.ninja', 'bun-profile.exe.rsp', 'bun-profile.exe.lazy.rsp',
            'obj/vendor/WebKit/Source/WTF/wtf/bun/RunLoopBun.cpp.obj',
            'obj/deps/WebKit/JavaScriptCore/DerivedSources/unified-sources/UnifiedSource-runtime-28.cpp.obj'
          )
          foreach ($path in $paths) {
            $inputPath = Join-Path $root $path
            if (Test-Path -LiteralPath $inputPath -PathType Leaf) {
              $target = Join-Path $evidence $path
              New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
              Copy-Item -LiteralPath $inputPath -Destination $target
              Get-FileHash -Algorithm SHA256 -LiteralPath $inputPath | Format-List | Out-File -Append (Join-Path $evidence 'hashes.txt')
            }
          }
          $archives = @(Get-ChildItem (Join-Path $root 'rust-target') -File -Recurse -Filter 'libbun_runtime-*.rlib' -ErrorAction SilentlyContinue)
          if ($archives.Count -eq 1) {
            Get-FileHash -Algorithm SHA256 $archives[0].FullName | Format-List | Out-File (Join-Path $evidence 'runtime-archive-hash.txt')
            $llvmNm = @('C:\LLVM23\bin\llvm-nm.exe', 'C:\Program Files\LLVM\bin\llvm-nm.exe') | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            if ($llvmNm) { & $llvmNm --format=posix --defined-only $archives[0].FullName *> (Join-Path $evidence 'runtime-archive-symbols.txt') }
          }
      - name: Retain built runtime
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.retention-diagnostic == 'runtime-strong-build' && 'windows-strong-timer-diagnostic' || (inputs.retention-diagnostic == 'runtime-force-build' && 'windows-forced-timer-source-runtime') || (contains(fromJSON('["runtime-rust-symbols", "runtime-rust-relink"]'), inputs.retention-diagnostic) && 'windows-source-rust-symbols') || 'windows-uninstrumented-source-runtime' }}
          path: |
            bun-source/build/release-local/bun.exe
            ${{ runner.temp }}/runtime-build-adjustments.json
            ${{ runner.temp }}/runtime-link-inputs/
            ${{ runner.temp }}/runtime-rust-symbols/
            !${{ runner.temp }}/runtime-rust-symbols/**/*.obj
            !${{ runner.temp }}/runtime-rust-symbols/**/*.dll
            !${{ runner.temp }}/runtime-rust-symbols/**/*.lib
            !${{ runner.temp }}/runtime-rust-symbols/**/*.pdb
          if-no-files-found: warn
          retention-days: 7

  linux-runtime-cross-build:
    name: Cross-build diagnostic Windows runtime
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-cross-build' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oven-sh/bun
          ref: b1007f1177fd402fae67387b8548cae5ae9b5707
          path: bun-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oven-sh/WebKit
          ref: 4d45755fed4aeef19e95beb90d3d0c884a2812bd
          path: webkit-source
          sparse-checkout: |
            Source
            Tools
            icu
          persist-credentials: false
      - name: Install pinned cross-build tools
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llvm-23.1.1.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz
          printf '%s  %s\n' '832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c' "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/llvm"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm" --strip-components=1
          echo "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y nasm
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src --component llvm-tools --target x86_64-pc-windows-msvc
      - name: Build pinned Windows runtime from Linux
        shell: bash
        env:
          BUN_WEBKIT_PATH: ${{ github.workspace }}/webkit-source
          RUSTUP_TOOLCHAIN: nightly-2026-09-15
          BUILDKITE_COMMIT: b1007f1177fd402fae67387b8548cae5ae9b5707
          GIT_SHA: b1007f1177fd402fae67387b8548cae5ae9b5707
        run: |
          set -euo pipefail
          export GITHUB_SHA="$BUILDKITE_COMMIT"
          test "$(git -C bun-source rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C webkit-source rev-parse HEAD)" = 4d45755fed4aeef19e95beb90d3d0c884a2812bd
          cd bun-source
          bun install --frozen-lockfile
          # On CI, the pinned Bun build fetches the Microsoft SDK/MSVC sysroot
          # with xwin --accept-license when no complete sysroot is present.
          bun scripts/build.ts --profile=release-local --lto=on --trimmable=on --os=windows --arch=x64 --build-dir=build/release-cross-windows
          test -f build/release-cross-windows/bun.exe
          sha256sum build/release-cross-windows/bun.exe > "$RUNNER_TEMP/cross-runtime-sha256.txt"
      - name: Retain diagnostic runtime and identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cross-source-runtime
          path: |
            bun-source/build/release-cross-windows/bun.exe
            ${{ runner.temp }}/cross-runtime-sha256.txt
          if-no-files-found: warn
          retention-days: 7

  linux-runtime-cross-tools:
    name: Verify Linux Windows cross-build tools
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-cross-tools' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install pinned LLVM, NASM and Rust cross target
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/llvm-23.1.1.tar.xz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz
          printf '%s  %s\n' '832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c' "$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/llvm"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm" --strip-components=1
          sudo apt-get update
          sudo apt-get install -y nasm
          rustup toolchain install nightly-2026-09-15 --profile minimal --component rust-src --component llvm-tools --target x86_64-pc-windows-msvc
          export PATH="$RUNNER_TEMP/llvm/bin:$PATH"
          for tool in clang clang-cl lld-link llvm-lib llvm-rc; do
            command -v "$tool"
          done
          clang --version | head -n 1
          clang-cl --version | head -n 1
          lld-link --version
          nasm --version
          rustup run nightly-2026-09-15 rustc --version --verbose
          rustup target list --toolchain nightly-2026-09-15 --installed
          df -h "$RUNNER_TEMP"

  linux-runtime-cross-preflight:
    name: Linux Windows cross-build preflight
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-cross-preflight' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect existing cross-build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          for tool in clang clang-cl lld-link llvm-lib llvm-rc cmake ninja nasm rustup cargo; do
            if command -v "$tool" >/dev/null; then
              printf '%s: %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '%s: unavailable\n' "$tool"
            fi
          done
          if command -v clang >/dev/null; then clang --version; fi
          if command -v rustup >/dev/null; then rustup show; fi
          for root in /opt/winsysroot /opt/xwin; do
            if [[ -d "$root" ]]; then printf '%s: present\n' "$root"; else printf '%s: absent\n' "$root"; fi
          done

  windows-runtime-preflight:
    name: Windows runtime build preflight
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'runtime-preflight' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Inspect available build tools and disk space
        shell: pwsh
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID, Size, FreeSpace | Format-Table
          foreach ($tool in @('clang', 'clang-cl', 'lld-link', 'rustup', 'cargo', 'go', 'nasm', 'ruby', 'perl', 'python', 'cmake', 'ninja', 'make', 'bash')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command) { Write-Output "$tool : $($command.Source)" } else { Write-Output "$tool : unavailable" }
          }
          if (Get-Command clang -CommandType Application -ErrorAction SilentlyContinue) { clang --version }
          if (Get-Command rustup -CommandType Application -ErrorAction SilentlyContinue) { rustup show }
          # Inventory the already-installed SDK and MSVC/ATL before considering
          # a cross-build sysroot; do not download or accept any license here.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Visual Studio installation not found' }
          Write-Output "Visual Studio: $vs"
          Get-ChildItem (Join-Path $vs 'VC/Tools/MSVC') -Directory | ForEach-Object {
            $atl = Join-Path $_.FullName 'atlmfc/include/atlstr.h'
            $crt = Join-Path $_.FullName 'include/vcruntime.h'
            Write-Output "MSVC $($_.Name): ATL=$(Test-Path $atl), CRT=$(Test-Path $crt)"
          }
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          Get-ChildItem (Join-Path $kit 'Include') -Directory | ForEach-Object {
            $kernel = Join-Path $kit "Lib/$($_.Name)/um/x64/kernel32.lib"
            Write-Output "SDK $($_.Name): kernel32=$(Test-Path $kernel)"
          }

  linux:
    name: Linux core/Solid/React development and AOT comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.retention-diagnostic == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      # Dispatch inputs reach the shell only through the environment.
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
      INPUT_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['input-trials'] || '5' }}
      COLD_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs['cold-cache'] || 'false' }}
      STREAMING_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs['streaming-trials'] || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          mkdir "$RUNNER_TEMP/comparison"
          echo "COMPARISON=$RUNNER_TEMP/comparison" >> "$GITHUB_ENV"
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: echo 'BUN_JSC_useConcurrentJIT=0' >> "$GITHUB_ENV"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      # The same index-verified archive set (and cache key) as Native Linux, so a
      # mirror outage does not fail the comparison once Native Linux has cached it.
      - name: Install native build and isolated X11 prerequisites
        timeout-minutes: 25
        uses: ./.github/actions/linux-native-prerequisites
      - name: Build release native host
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host; } 2>&1 | tee "$COMPARISON/host-build.log"
          sha256sum target/release/bun-native-host > "$COMPARISON/host-sha256.txt"
      - name: Build the direct Rust GPUI baseline
        run: |
          cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --example workload-baseline 2>&1 | tee "$COMPARISON/rust-baseline-build.log"
          sha256sum target/release/examples/workload-baseline > "$COMPARISON/rust-baseline-sha256.txt"
      - name: Run the equivalent-workload comparison in one isolated native session
        timeout-minutes: 40
        run: |
          extra=()
          if [[ "$COLD_CACHE" == 'true' ]]; then extra+=(--cold-cache); fi
          bash scripts/quality/native-x11-session.sh \
            "$COMPARISON/session" -- bun benchmarks/comparison/run.ts \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --output "$COMPARISON/run" --trials "$TRIALS" --input-trials "$INPUT_TRIALS" \
            "${extra[@]}"
      # Same runner and session type, after the Bun Native trials. Its operation
      # timings are state application, not acknowledgements; compare process metrics.
      - name: Run the direct Rust GPUI baseline in one isolated native session
        timeout-minutes: 10
        run: |
          bash scripts/quality/native-x11-session.sh \
            "$COMPARISON/rust-session" -- bun benchmarks/rust-gpui/run.ts \
            --binary "$GITHUB_WORKSPACE/target/release/examples/workload-baseline" \
            --output "$COMPARISON/rust-gpui" --trials "$TRIALS"
          {
            echo '## Direct Rust GPUI baseline (same runner)'
            echo
            echo '| Metric | median | 95% CI |'
            echo '| --- | --- | --- |'
            jq -r '.summary.perLaunch | to_entries[] | select(.key | test("spawnTo|processWall|cpu|peakTree")) | "| \(.key) | \(.value.median) | \(.value.medianInterval.low) to \(.value.medianInterval.high) |"' "$COMPARISON/rust-gpui/rust-gpui.json"
          } >> "$GITHUB_STEP_SUMMARY"
      # The versioned streaming/virtualization fixture (#257) through Solid and
      # React in development and AOT on the same host and runner. Each soak is
      # one fresh launch and one sample per metric for the regression gate.
      - name: Run the streaming-list fixture through Solid and React in development and AOT
        if: ${{ !cancelled() && hashFiles('target/release/bun-native-host') != '' }}
        timeout-minutes: 20
        env:
          BUN_NATIVE_HOST: ${{ github.workspace }}/target/release/bun-native-host
        run: |
          if [[ ! "$STREAMING_TRIALS" =~ ^([1-9]|10)$ ]]; then
            echo "streaming-trials must be 1 to 10, got $STREAMING_TRIALS" >&2
            exit 1
          fi
          mkdir -p "$COMPARISON/streaming"
          for framework in solid react; do
            entry="$framework-streaming-list"
            package="$COMPARISON/streaming/$entry-package"
            bun experiments/aot-gpui/build-window.ts \
              --source "$GITHUB_WORKSPACE" --host "$BUN_NATIVE_HOST" \
              --host-profile release --entry "$entry" --outdir "$package"
            for trial in $(seq 1 "$STREAMING_TRIALS"); do
              for mode in development aot; do
                command=(bun "$package/development/application.js")
                if [[ "$mode" == aot ]]; then
                  command=("$package/$entry")
                fi
                evidence="$COMPARISON/streaming/$framework-$mode-$trial"
                bash scripts/quality/native-x11-session.sh \
                  "$evidence-session" -- python3 tests/native/streaming-list.py \
                  --framework "$framework" --mode "$mode" --host-profile release \
                  --output "$evidence" -- "${command[@]}"
              done
            done
          done
          python3 tests/native/streaming-list.py summarize \
            --output "$COMPARISON/streaming/streaming-list-baseline.json" \
            "$COMPARISON"/streaming/*-[0-9]*/result.json
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/run/comparison.json" ]]; then
            echo 'The comparison wrote no comparison.json; the artifact keeps its logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun benchmarks/comparison/export.ts "$COMPARISON/run" "$COMPARISON/export" | tee "$COMPARISON/summary.md"
          {
            echo '## Equivalent-workload comparison (Linux, software renderer request)'
            echo
            jq -r '"Status: \(.status); failed launches: \(.failedLaunches // [] | length)"' "$COMPARISON/run/comparison.json"
            echo
            cat "$COMPARISON/summary.md"
            echo
            echo 'Click to native paint is the driver interval from immediately before the XTest click command to the validated complete native paint record; it is not display presentation. See benchmarks/COMPARISON.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      # Regression gate (#259): per-launch samples against the committed baseline
      # with the identical environment label. A model with no baseline is
      # reported, not gated. Fails on a stable >25% regression or missing metric:
      # two hosted VMs with the same CPU model measured identical code 12-15%
      # apart (run 42432829952), so 10% is a dedicated-machine threshold.
      - name: Regression gate against the committed baseline for this runner
        if: ${{ !cancelled() && env.COMPARISON != '' }}
        run: |
          if [[ ! -f "$COMPARISON/export/comparison.json" ]]; then
            echo 'No exported comparison, so nothing was gated; the comparison step failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          streaming=()
          for result in "$COMPARISON"/streaming/*-[0-9]*/result.json; do
            [[ -f "$result" ]] && streaming+=("$result")
          done
          bun benchmarks/comparison/metrics.ts export "$COMPARISON/export" \
            --output "$COMPARISON/metrics.json" --streaming "${streaming[@]}"
          status=0
          bun benchmarks/comparison/metrics.ts gate "$COMPARISON/metrics.json" \
            benchmarks/comparison/baselines --threshold 0.25 > "$COMPARISON/regression.md" || status=$?
          {
            echo '## Regression gate'
            echo
            cat "$COMPARISON/regression.md"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$COMPARISON/regression.md"
          if [[ "$status" != 0 ]]; then
            echo '::error title=Performance regression::A stable regression or missing metric against the committed baseline; see the Regression gate summary.'
          fi
          exit "$status"
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-linux-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application
            !${{ runner.temp }}/comparison/session/runtime/
            !${{ runner.temp }}/comparison/rust-session/runtime/
            !${{ runner.temp }}/comparison/streaming/*-package/
            !${{ runner.temp }}/comparison/streaming/*-session/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # The same comparison and direct Rust GPUI baseline on a hosted Apple silicon
  # VM (#244). XTest click-to-paint is Linux only, so input trials are 0 here.
  # The hosted VM's paravirtual Metal device is not a physical GPU.
  macos:
    name: macOS core/Solid/React and direct Rust GPUI comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.retention-diagnostic == 'none')
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          mkdir "$RUNNER_TEMP/comparison"
          echo "COMPARISON=$RUNNER_TEMP/comparison" >> "$GITHUB_ENV"
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: echo 'BUN_JSC_useConcurrentJIT=0' >> "$GITHUB_ENV"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      - name: Build release native host and the direct Rust GPUI baseline
        run: |
          { time -p cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example workload-baseline; } 2>&1 | tee "$COMPARISON/host-build.log"
          shasum -a 256 target/release/bun-native-host target/release/examples/workload-baseline > "$COMPARISON/binary-sha256.txt"
          system_profiler SPDisplaysDataType SPHardwareDataType > "$COMPARISON/hardware.txt" 2>&1 || true
      - name: Run the equivalent-workload comparison
        timeout-minutes: 40
        run: |
          bun benchmarks/comparison/run.ts \
            --host "$GITHUB_WORKSPACE/target/release/bun-native-host" --host-profile release \
            --output "$COMPARISON/run" --trials "$TRIALS" --input-trials 0
      - name: Run the direct Rust GPUI baseline
        if: ${{ !cancelled() && hashFiles('target/release/examples/workload-baseline') != '' }}
        timeout-minutes: 10
        run: |
          bun benchmarks/rust-gpui/run.ts \
            --binary "$GITHUB_WORKSPACE/target/release/examples/workload-baseline" \
            --output "$COMPARISON/rust-gpui" --trials "$TRIALS"
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          if [[ -f "$COMPARISON/run/comparison.json" ]]; then
            bun benchmarks/comparison/export.ts "$COMPARISON/run" "$COMPARISON/export" | tee "$COMPARISON/summary.md"
            {
              echo '## Equivalent-workload comparison (macOS, hosted VM)'
              echo
              jq -r '"Status: \(.status); failed launches: \(.failedLaunches // [] | length)"' "$COMPARISON/run/comparison.json"
              echo
              cat "$COMPARISON/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$COMPARISON/rust-gpui/rust-gpui.json" ]]; then
            {
              echo '## Direct Rust GPUI baseline (same runner)'
              echo
              echo '| Metric | median | 95% CI |'
              echo '| --- | --- | --- |'
              jq -r '.summary.perLaunch | to_entries[] | select(.key | test("spawnTo|processWall|cpu|peakTree")) | "| \(.key) | \(.value.median) | \(.value.medianInterval.low) to \(.value.medianInterval.high) |"' "$COMPARISON/rust-gpui/rust-gpui.json"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-comparison-macos-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  # The same comparison and direct Rust GPUI baseline on a hosted Windows x64
  # VM (#244). XTest click-to-paint is Linux only, so input trials are 0 here.
  # Process-tree working set, CPU time and load come from
  # benchmarks/comparison/windows-processes.ts. The VM has no physical GPU.
  windows:
    name: Windows core/Solid/React and direct Rust GPUI comparison
    if: vars.CI_BILLING_PAUSED == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.retention-diagnostic == 'none' || inputs.retention-diagnostic == 'native-fixture')
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: 0
      PYTHONDONTWRITEBYTECODE: 1
      TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.trials || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare result directory
        run: |
          $comparison = Join-Path $env:RUNNER_TEMP 'comparison'
          New-Item -ItemType Directory $comparison | Out-Null
          "COMPARISON=$comparison" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Disable the concurrent JIT for this diagnostic dispatch (#629)
        if: github.event_name == 'workflow_dispatch' && inputs['concurrent-jit'] == 'off'
        run: "'BUN_JSC_useConcurrentJIT=0' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8"
      - name: Install the pinned Bun and Rust toolchains and downloads
        id: toolchain
        uses: ./.github/actions/native-toolchain
      - name: Install the isolated native fixture diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'native-fixture'
        run: |
          python benchmarks/retention/prepare-native-fixture.py $env:COMPARISON
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture diagnostic preparation failed' }
      - name: Locate the installed Windows SDK shader compiler
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem -Directory $sdk |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64/fxc.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (!$fxc) { throw 'GPUI release shaders require the Windows SDK fxc.exe' }
          "GPUI_FXC_PATH=$fxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build release native host and the direct Rust GPUI baseline
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cargo build --locked --release --manifest-path Cargo.toml -p bun-native-host --bin bun-native-host --example workload-baseline 2>&1 |
            Tee-Object -FilePath (Join-Path $env:COMPARISON 'host-build.log')
          $code = $LASTEXITCODE
          "real $($timer.Elapsed.TotalSeconds)" | Out-File -Append (Join-Path $env:COMPARISON 'host-build.log')
          if ($code -ne 0) { throw "Native build failed: $code" }
          Get-FileHash -Algorithm SHA256 target/release/bun-native-host.exe, target/release/examples/workload-baseline.exe |
            Format-List | Out-File (Join-Path $env:COMPARISON 'binary-sha256.txt')
          & {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture
            Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
            Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, VideoModeDescription
            "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          } | Format-List | Out-File (Join-Path $env:COMPARISON 'hardware.txt')
      - name: Run the equivalent-workload comparison
        timeout-minutes: 45
        run: |
          bun benchmarks/comparison/run.ts `
            --host (Join-Path $env:GITHUB_WORKSPACE 'target/release/bun-native-host.exe') --host-profile release `
            --output (Join-Path $env:COMPARISON 'run') --trials $env:TRIALS --input-trials 0
          if ($LASTEXITCODE -ne 0) { throw "The comparison exited $LASTEXITCODE" }
      - name: Run the direct Rust GPUI baseline
        if: ${{ !cancelled() && hashFiles('target/release/examples/workload-baseline.exe') != '' }}
        timeout-minutes: 10
        run: |
          bun benchmarks/rust-gpui/run.ts `
            --binary (Join-Path $env:GITHUB_WORKSPACE 'target/release/examples/workload-baseline.exe') `
            --output (Join-Path $env:COMPARISON 'rust-gpui') --trials $env:TRIALS
          if ($LASTEXITCODE -ne 0) { throw "The Rust GPUI baseline exited $LASTEXITCODE" }
      - name: Export the compact record and summary table
        if: ${{ always() && env.COMPARISON != '' }}
        run: |
          $comparison = Join-Path $env:COMPARISON 'run/comparison.json'
          if (Test-Path -LiteralPath $comparison) {
            bun benchmarks/comparison/export.ts (Join-Path $env:COMPARISON 'run') (Join-Path $env:COMPARISON 'export') |
              Tee-Object -FilePath (Join-Path $env:COMPARISON 'summary.md')
            if ($LASTEXITCODE -ne 0) { throw "The export exited $LASTEXITCODE" }
            $record = Get-Content -Raw $comparison | ConvertFrom-Json
            $failedLaunches = ($record.failedLaunches | Measure-Object).Count
            & {
              '## Equivalent-workload comparison (Windows, hosted VM)'
              ''
              "Status: $($record.status); failed launches: $failedLaunches"
              ''
              Get-Content -Raw (Join-Path $env:COMPARISON 'summary.md')
            } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          $rust = Join-Path $env:COMPARISON 'rust-gpui/rust-gpui.json'
          if (Test-Path -LiteralPath $rust) {
            $baseline = Get-Content -Raw $rust | ConvertFrom-Json
            & {
              '## Direct Rust GPUI baseline (same runner)'
              ''
              '| Metric | median | 95% CI |'
              '| --- | --- | --- |'
              $baseline.summary.perLaunch.PSObject.Properties |
                Where-Object { $_.Name -match 'spawnTo|processWall|cpu|peakTree' } |
                ForEach-Object { "| $($_.Name) | $($_.Value.median) | $($_.Value.medianInterval.low) to $($_.Value.medianInterval.high) |" }
            } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Retain raw results, including failures
        if: ${{ always() && env.COMPARISON != '' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.retention-diagnostic == 'native-fixture' && format('native-fixture-diagnostic-windows-{0}', runner.arch) || format('benchmark-comparison-windows-{0}', runner.arch) }}
          path: |
            ${{ runner.temp }}/comparison/
            !${{ runner.temp }}/comparison/run/*/application.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Restore the original fixture in the isolated checkout
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'native-fixture' && env.COMPARISON != '' }}
        run: |
          $original = Join-Path $env:COMPARISON 'original-react.tsx.txt'
          if (Test-Path -LiteralPath $original) {
            Copy-Item -LiteralPath $original -Destination 'benchmarks/solid/react.tsx' -Force
            if ((Get-FileHash -Algorithm SHA256 'benchmarks/solid/react.tsx').Hash -ne 'ce636a55012d21d54cecc89ad0664d76d3ef9fc0a83211ca27bd301d350745a1') { throw 'Fixture restoration failed' }
          }

  windows-retention-scan:
    name: Windows retention scan control
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'narrow-scan' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Build pinned headless peer and inspected AOT workload
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-retention-scan'
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:CONTROL_ROOT = $root
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          bun -e 'import { bundleApplication } from "./scripts/native/bundle.ts"; await bundleApplication({framework:"react",entry:"benchmarks/solid/react.tsx",outdir:process.env.CONTROL_ROOT + "/react",cwd:process.cwd()})'
          if ($LASTEXITCODE -ne 0) { throw 'React bundle failed' }
          bun --no-install compile --no-script --production --explain=json (Join-Path $root 'react/application.js') --outfile (Join-Path $root 'react-aot.exe') *> (Join-Path $root 'compile.log')
          if ($LASTEXITCODE -ne 0) { throw 'AOT compile failed' }
          bun -e 'import { inspectBunExecutable } from "./scripts/native/inspect.ts"; import { inspectBunRuntime } from "./scripts/native/inspect-runtime.ts"; const graph=inspectBunExecutable(process.argv[1]); const runtime=inspectBunRuntime(process.argv[1]); if (!graph.hasCompiledProgram || runtime.jit !== "unused") throw new Error("Not AOT"); console.log(JSON.stringify({graph,runtime},null,2))' (Join-Path $root 'react-aot.exe') > (Join-Path $root 'inspection.json')
          if ($LASTEXITCODE -ne 0) { throw 'AOT inspection failed' }
      - name: Alternate scan settings with positive controls
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-retention-scan'
          $runtime = (Get-Command bun -CommandType Application).Source
          $env:BUN_NATIVE_DIAG_NARROW_DUMP = '1'
          try {
            foreach ($trial in 0..4) {
              $order = if ($trial % 2 -eq 0) { @('1', '0') } else { @('0', '1') }
              foreach ($scan in $order) {
                $env:BUN_JSC_useNarrowReferenceScan = $scan
                python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') (Join-Path $root 'react/application.js') (Join-Path $root 'react-aot.exe') (Join-Path $root "$trial-scan-$scan") 1 $runtime
                if ($LASTEXITCODE -ne 0) { throw "Scan $scan pair failed outside retention observation" }
              }
            }
            foreach ($scan in @('1', '0')) {
              $env:BUN_JSC_useNarrowReferenceScan = $scan
              python benchmarks/retention/react-dispatch-control.py (Join-Path $root 'peer.exe') (Join-Path $root "positive-scan-$scan") 1 cycle $runtime
              if ($LASTEXITCODE -ne 0) { throw "Scan $scan positive control failed" }
            }
          } finally {
            Remove-Item Env:BUN_JSC_useNarrowReferenceScan -ErrorAction SilentlyContinue
            Remove-Item Env:BUN_NATIVE_DIAG_NARROW_DUMP -ErrorAction SilentlyContinue
          }
      - name: Retain observations and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-retention-scan
          path: |
            ${{ runner.temp }}/windows-retention-scan/
            !${{ runner.temp }}/windows-retention-scan/**/*.exe
          retention-days: 30

  windows-batch-release:
    name: Windows paired batch-release control
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'batch-release' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Build pinned baseline and candidate workloads
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'batch-release-control'
          New-Item -ItemType Directory -Path $root | Out-Null
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
          python benchmarks/retention/batch-release-build.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Source-matched control build failed' }
      - name: Alternate source variants and check pinned control
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'batch-release-control'
          $runtime = (Get-Command bun -CommandType Application).Source
          foreach ($trial in 0..4) {
            $order = if ($trial % 2 -eq 0) { @('baseline', 'candidate') } else { @('candidate', 'baseline') }
            foreach ($variant in $order) {
              python benchmarks/retention/headless-adapter-control.py react (Join-Path $root 'peer.exe') (Join-Path $root "$variant/application.js") (Join-Path $root "$variant.exe") (Join-Path $root "$trial-$variant") 1 $runtime
              if ($LASTEXITCODE -ne 0) { throw "$variant pair failed outside retention observation" }
            }
          }
          python benchmarks/retention/react-dispatch-control.py (Join-Path $root 'peer.exe') (Join-Path $root 'positive-candidate') 1 cycle $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Candidate positive control failed' }
      - name: Retain observations and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-batch-release-control
          path: |
            ${{ runner.temp }}/batch-release-control/
            !${{ runner.temp }}/batch-release-control/**/*.exe
          retention-days: 30

  windows-fixture-core-matrix:
    name: Windows fixture and batch ownership matrix
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && inputs.retention-diagnostic == 'fixture-core-matrix' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 70
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Build the pinned headless peer
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fixture-core-matrix'
          New-Item -ItemType Directory -Path $root | Out-Null
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
      - name: Compare fixture ownership controls under both batch variants
        run: |
          python benchmarks/retention/fixture-core-matrix.py (Join-Path $env:RUNNER_TEMP 'fixture-core-matrix')
          if ($LASTEXITCODE -ne 0) { throw 'The fixture and batch ownership matrix failed' }
      - name: Retain every control and source identity
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-fixture-core-matrix
          path: |
            ${{ runner.temp }}/fixture-core-matrix/
            !${{ runner.temp }}/fixture-core-matrix/**/*.exe
          retention-days: 30

  windows-listener-control:
    name: Windows listener retention control
    if: vars.CI_BILLING_PAUSED == 'false' && github.event_name == 'workflow_dispatch' && (inputs.retention-diagnostic == 'listener' || inputs.retention-diagnostic == 'shutdown' || inputs.retention-diagnostic == 'first-observation') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          rust: 'false'
      - name: Build the pinned headless peer
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'listener-retention-control'
          New-Item -ItemType Directory -Path $root | Out-Null
          bun build tests/core/protocol-peer.ts --compile --outfile (Join-Path $root 'peer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Peer build failed' }
      - name: Run the selected retention control
        env:
          RETENTION_CONTROL_KIND: ${{ inputs.retention-diagnostic }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'listener-retention-control'
          $runtime = (Get-Command bun -CommandType Application).Source
          $kind = $env:RETENTION_CONTROL_KIND
          python benchmarks/retention/react-dispatch-control.py (Join-Path $root 'peer.exe') (Join-Path $root 'results') 3 $kind $runtime
          if ($LASTEXITCODE -ne 0) { throw 'A retention control was invalid' }
      - name: Retain observations and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-listener-control
          path: |
            ${{ runner.temp }}/listener-retention-control/
            !${{ runner.temp }}/listener-retention-control/**/*.exe
          retention-days: 30
