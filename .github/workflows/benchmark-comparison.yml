name: Benchmark comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonleaf-windows:
    name: Windows source-matched guard-cost control
    if: vars.CI_BILLING_PAUSED == 'false'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-toolchain
        with:
          install: 'false'
      - name: Build matching baseline and candidate controls
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nonleaf-control'
          New-Item -ItemType Directory $root | Out-Null
          "EVIDENCE=$root" >> $env:GITHUB_ENV
          $tree = 'native/protocol/src/tree.rs'
          if ((Get-FileHash $tree -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3965647d1a316442adfddbab00663fe78eef5cfa38d62606586e6a74255dd177') { throw 'Baseline source mismatch' }
          $fixture = 'benchmarks/protocol/leaf-ancestor-diagnostic.rs'
          if ((Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant() -ne '782018c4412e7437326fa666c52909eff5b0b115c333ec8ea86b2f50162d8fe9') { throw 'Fixture mismatch' }
          Copy-Item $fixture native/protocol/examples/leaf_ancestor_perf.rs
          cargo build --locked --release -p bun-native-protocol --example leaf_ancestor_perf
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          Copy-Item target/release/examples/leaf_ancestor_perf.exe (Join-Path $root 'baseline.exe')
          python benchmarks/protocol/nonleaf-candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate source did not match' }
          cargo test --locked -p bun-native-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Candidate protocol tests failed' }
          cargo build --locked --release -p bun-native-protocol --example leaf_ancestor_perf
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          Copy-Item target/release/examples/leaf_ancestor_perf.exe (Join-Path $root 'candidate.exe')
          $baseHash = (Get-FileHash (Join-Path $root 'baseline.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $candidateHash = (Get-FileHash (Join-Path $root 'candidate.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseHash -eq $candidateHash) { throw 'Binaries must be distinct' }
          @{ head = $env:GITHUB_SHA; baselineTree = '3965647d1a316442adfddbab00663fe78eef5cfa38d62606586e6a74255dd177'; candidateTree = '77f45759baff22d5dd33093a46d3858ba872ba137da3abd53e1aae5a7e3bc1a3'; fixture = '782018c4412e7437326fa666c52909eff5b0b115c333ec8ea86b2f50162d8fe9'; rustc = (rustc --version); scope = 'in-process protocol preflight only' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'metadata.json')
      - name: Run alternating A/A and two independent A/B controls
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'nonleaf-control'
          python benchmarks/protocol/nonleaf-pairs.py (Join-Path $root 'baseline.exe') (Join-Path $root 'baseline.exe') (Join-Path $root 'aa.json') (Join-Path $root 'metadata.json')
          if ($LASTEXITCODE -ne 0) { throw 'A/A control failed' }
          foreach ($name in @('ab', 'ab-repeat')) {
            python benchmarks/protocol/nonleaf-pairs.py (Join-Path $root 'baseline.exe') (Join-Path $root 'candidate.exe') (Join-Path $root "$name.json") (Join-Path $root 'metadata.json')
            if ($LASTEXITCODE -ne 0) { throw "$name control failed" }
          }
      - name: Retain controls
        if: always() && env.EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-guard-cost-control
          path: |
            ${{ runner.temp }}/nonleaf-control/
            !${{ runner.temp }}/nonleaf-control/*.exe
          if-no-files-found: warn
          retention-days: 30
